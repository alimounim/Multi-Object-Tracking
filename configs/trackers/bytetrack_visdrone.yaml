# ByteTrack tuned on VisDrone2019-MOT val (scripts/tune_tracker.py, YOLO26n fine-tuned on MOT train, epoch 3).
# Changes from Ultralytics defaults: new_track_thresh 0.25 -> 0.55, match_thresh 0.8 -> 0.9.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.55
track_buffer: 30
match_thresh: 0.9
fuse_score: True
