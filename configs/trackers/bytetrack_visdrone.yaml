# ByteTrack tuned on VisDrone2019-MOT val (scripts/tune_tracker.py) for YOLO26n fine-tuned on MOT + DET train.
# Changes from Ultralytics defaults: track_high_thresh 0.25 -> 0.35, new_track_thresh 0.25 -> 0.65,
# match_thresh 0.8 -> 0.9.
tracker_type: bytetrack
track_high_thresh: 0.35
track_low_thresh: 0.1
new_track_thresh: 0.65
track_buffer: 30
match_thresh: 0.9
fuse_score: True
